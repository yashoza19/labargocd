name: Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "triage"]

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug!

  - type: input
    id: cluster-name
    attributes:
      label: Cluster Name
      description: Name of the affected cluster (if applicable)
      placeholder: e.g., dev-cluster-01
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component is affected?
      options:
        - Cluster Provisioning
        - Cluster Deprovisioning
        - ArgoCD Sync
        - Crossplane/IAM
        - GitHub Actions/CI
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear description of the bug
      placeholder: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Create cluster with...
        2. Wait for...
        3. Observe error...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Include any relevant log output
      render: shell
    validations:
      required: false

  - type: input
    id: version
    attributes:
      label: OpenShift Version
      description: OpenShift/ACM version if relevant
      placeholder: e.g., 4.14.10
    validations:
      required: false
